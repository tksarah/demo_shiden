<!doctype html><html lang="ja"><meta charset="utf-8"><title>髪・マントの画像比較</title><style>body{font:18px system-ui;background:#0e0b24;color:#eee;padding:20px}button{font:inherit;padding:12px}table{border-collapse:collapse;margin:20px 0}td,th{border:1px solid #76558b;padding:8px 16px}canvas{width:100%;max-width:1254px;background:#0e0b24}#result{font-weight:bold;color:#e4c38a}</style>
<h1>待機アニメーションの画像比較</h1><p>元画像に対し、異なる風の時刻で左右の靴・脚・顔・本を比較します。ネットワーク接続は行いません。</p><button id="run">画像比較を実行</button><p id="result" role="status">準備完了</p><table><thead><tr><th>比較領域</th><th>最大変更画素数</th><th>結果</th></tr></thead><tbody id="metrics"></tbody></table><canvas id="preview" width="1254" height="1254"></canvas>
<script type="module">
import {buildWorld} from '/world.js';
const $=id=>document.getElementById(id),canvas=$('preview'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const regions={leftBoot:[545,1050,120,190],rightBoot:[670,1005,135,225],legs:[545,875,180,115],face:[500,285,225,145],book:[700,535,110,95],hair:[190,740,95,125],cape:[305,970,78,90]};
async function dataURL(url){const blob=await(await fetch(url)).blob();return await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(blob);});}
const world=document.createElementNS('http://www.w3.org/2000/svg','svg');world.innerHTML=buildWorld();
const defs=world.querySelector('defs').cloneNode(true),pose=world.querySelector('#pose-idle svg').cloneNode(true);
const stage=document.createElementNS('http://www.w3.org/2000/svg','svg');stage.setAttribute('xmlns','http://www.w3.org/2000/svg');stage.setAttribute('width','1254');stage.setAttribute('height','1254');stage.setAttribute('viewBox','0 0 1254 1254');
stage.append(defs);while(pose.firstChild)stage.append(pose.firstChild);
for(const node of stage.querySelectorAll('image,feImage')){const href=node.getAttribute('href');if(href?.startsWith('./assets/')){node.setAttribute('href',await dataURL('/'+href.slice(2)));if(node.tagName==='feImage'){node.setAttribute('x','0');node.setAttribute('y','0');node.setAttribute('width','1254');node.setAttribute('height','1254');}}}
async function render(t,reduced=false){stage.querySelector('#idle-fabric').setAttribute('filter',reduced?'none':'url(#idle-breeze)');const hair=stage.querySelector('#hair-wind'),cape=stage.querySelector('#cape-wind');hair.setAttribute('dx',Math.sin(t*.85)*92);hair.setAttribute('dy',Math.cos(t*.7)*143);cape.setAttribute('dx',Math.sin(t*.98+1.7)*84);cape.setAttribute('dy',Math.cos(t*.9+.9)*121);const image=new Image();image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(stage));await image.decode();ctx.clearRect(0,0,1254,1254);ctx.drawImage(image,0,0);return ctx.getImageData(0,0,1254,1254).data;}
function changed(a,b,[x,y,w,h]){let n=0;for(let row=y;row<y+h;row++)for(let col=x;col<x+w;col++){const p=(row*1254+col)*4;if([0,1,2,3].some(k=>Math.abs(a[p+k]-b[p+k])>1))n++;}return n;}
$('run').onclick=async()=>{try{$('run').disabled=true;$('result').textContent='比較中…';const base=await render(0),max=Object.fromEntries(Object.keys(regions).map(k=>[k,0]));for(const t of [1,3,6,9]){const next=await render(t);for(const [key,roi]of Object.entries(regions))max[key]=Math.max(max[key],changed(base,next,roi));}const normal=await render(0,true),reduced=await render(9,true),still=changed(normal,reduced,[0,0,1254,1254]);const checks=Object.entries(max).map(([key,value])=>({key,value,ok:['hair','cape'].includes(key)?value>20:value===0}));checks.push({key:'reducedMotion',value:still,ok:still===0});$('metrics').innerHTML=checks.map(r=>`<tr><td>${r.key}</td><td>${r.value}</td><td>${r.ok?'PASS':'FAIL'}</td></tr>`).join('');$('result').textContent=checks.every(r=>r.ok)?'PASS：足・体は固定、髪とマントだけが揺れます。':'FAIL：比較表を確認してください。';await render(6);}catch(error){$('result').textContent='ERROR: '+error.message;}finally{$('run').disabled=false;}};
</script></html>
